server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true

spring:
  application:
    name: drs-backend
  profiles:
    active: local
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

drs:
  auth:
    token-header: X-Access-Token
