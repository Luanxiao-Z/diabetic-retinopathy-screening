# ============================================================================
# DR 智能筛查系统 —— 容器化部署编排示例
# ----------------------------------------------------------------------------
# 说明：
#   - 本文件为**容器化部署示例**；项目默认交付形态为本地直接运行（见 README）。
#   - 敏感项统一由同目录 .env 注入（参考 deploy/.env.example），**不写入本文件**。
#   - build context 为仓库根目录，Dockerfile 位于 deploy/docker/。
#
# 用法（仓库根目录）：
#   cp deploy/.env.example deploy/.env   # 按需修改密码
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml ps
#
# 后端配置读取说明（重要）：
#   后端 application.yml 使用 ${DB_PASSWORD} / ${REDIS_PASSWORD} /
#   ${MINIO_ACCESS_KEY} / ${MINIO_SECRET_KEY} 四个环境变量，且数据源地址、
#   Redis 地址、模型服务地址需通过 Spring Boot 环境变量覆盖为容器内地址，
#   否则容器会去连 127.0.0.1 而失败。
# ============================================================================
services:
  # ---------------------------------------------------------------- 基础设施
  mysql:
    image: mysql:8.0
    container_name: drs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-dr_screening}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 首次启动自动执行建表与字典初始化（脚本幂等）
      - ../sql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [drs-net]

  redis:
    image: redis:7
    container_name: drs-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [drs-net]

  minio:
    image: minio/minio
    container_name: drs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 deploy/.env 中设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 deploy/.env 中设置 MINIO_SECRET_KEY}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [drs-net]

  # ---------------------------------------------------------------- 应用服务
  model-service:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.model
    container_name: drs-model
    restart: unless-stopped
    ports:
      - "${MODEL_PORT:-8000}:8000"
    volumes:
      # 训练权重与指标不入镜像，改为挂载（权重不入库，需自行放置）
      - ../model-service/models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [drs-net]

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: drs-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      model-service:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      # —— 与 application.yml 占位符一致 ——
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      # —— 容器内地址覆盖（否则默认连 127.0.0.1）——
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-dr_screening}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DRS_MODEL_SERVICE_BASE_URL: http://model-service:8000
    networks: [drs-net]

  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: drs-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks: [drs-net]

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  drs-net:
    driver: bridge
