# ============================================================================
# Nginx 配置示例（前端静态托管 + API 反向代理）
# ----------------------------------------------------------------------------
# 用途：作为前端容器（deploy/docker/Dockerfile.frontend）的 Nginx 配置，
#       同时承担「静态资源服务」与「后端接口反向代理」两个角色。
#
# 关键点：
#   1. SPA 路由回退：Vue Router 为 history 模式，未知路径需回退 index.html，
#      否则刷新子路由（如 /screening/records）会 404。
#   2. 接口代理：前端请求 /api/v1/**，转发到后端容器 backend:8080，
#      并透传真实客户端 IP（后端操作日志依赖 X-Forwarded-For）。
#   3. 上传体积：眼底图较大，需放宽 client_max_body_size（与后端 20MB 对齐）。
#   4. 影像访问：眼底图与热力图位于 MinIO 私有桶，前端通过**预签名 URL 直连
#      MinIO**，因此默认不需要在此代理对象存储。
# ============================================================================

server {
    listen       80;
    server_name  _;

    charset      utf-8;
    root         /usr/share/nginx/html;
    index        index.html;

    # 与后端 multipart 上限（20MB）对齐，留出余量
    client_max_body_size 25m;

    server_tokens off;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- Gzip ----------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml;

    # ---------- 静态资源：带内容指纹的文件长缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 演示样例图等静态资源
    location /samples/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- 后端接口反向代理 ----------
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 批量上传 + 模型推理耗时较长，放宽超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Excel 导出为流式下载，关闭缓冲避免大文件落盘
        proxy_buffering off;
    }

    # ---------- 可选：内网隐藏 MinIO（需同步修改后端预签名地址）----------
    # location /storage/ {
    #     proxy_pass       http://minio:9000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # ---------- SPA 路由回退（必须放在最后）----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
