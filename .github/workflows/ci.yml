name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

# 同分支新推送自动取消旧运行，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven 编译
        working-directory: backend
        run: mvn -B --no-transfer-progress compile

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/web/yarn.lock
      - name: 安装依赖
        working-directory: frontend/web
        run: yarn install --frozen-lockfile
      - name: 类型检查
        working-directory: frontend/web
        run: yarn vue-tsc --noEmit
      - name: 构建
        working-directory: frontend/web
        run: yarn build

  model-service:
    name: 模型服务静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # 暂不在 CI 安装 torch（CUDA 轮子约 3GB）；无推理类测试前只做静态检查
      - name: Ruff 静态检查
        working-directory: model-service
        run: |
          # 锁定版本：未锁定时 ruff 升级会改变默认规则集，导致 CI 无故失败
          # （0.17 起默认集加入 BLE/PERF/RUF）。规则集另由 model-service/ruff.toml 固定。
          pip install ruff==0.17.4
          ruff check app/ training/
      - name: 语法检查
        working-directory: model-service
        run: python -m compileall app/ training/ -q
